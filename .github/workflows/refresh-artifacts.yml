name: Refresh scout artifacts

on:
  schedule:
    # 11:00 UTC, before the Vercel cron health check at 12:00 UTC.
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: scout-cache-${{ github.run_id }}
          restore-keys: scout-cache-
      - run: pip install -r requirements.txt
      - name: Rebuild Elo and the slate
        run: python -m src.cli build
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Commit artifacts
        run: |
          git config user.name "soccer-bet-scout"
          git config user.email "actions@users.noreply.github.com"
          git add data/artifacts
          if git diff --cached --quiet; then
            echo "No artifact changes"
          else
            git commit -m "Refresh Elo ratings and match predictions"
            git push
          fi
